<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Cadu & Fellipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../img/logo preta.png" />
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <a href="../index.html" style="display: inline-block;">
        <img src="../img/logo.png" alt="Logo Cadu & Fellipe" class="logo">
      </a>
      <h1>Novo Cadastro</h1>
      <p class="subtitle">Apenas o administrador autorizado pode se cadastrar</p>

      <form id="cadastroForm">
        <div class="input-group">
          <input type="email" id="email" placeholder="E-mail" required>
        </div>
        <div class="input-group">
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Senha" required>
            <button type="button" class="toggle-password" id="btnTogglePassword" aria-label="Mostrar ou ocultar senha" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="input-group">
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirmar Senha" required>
            <button type="button" class="toggle-password" id="btnToggleConfirm" aria-label="Mostrar ou ocultar confirmação de senha" title="Mostrar senha">
              <svg class="eye-open" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">Criar Conta</button>
      </form>
      <div id="cadastroError" class="error-msg"></div>
      
      <p class="register-link" style="margin-top: 20px; font-size: 14px; color: var(--muted);">
        Já possui conta? <a href="login.html" style="color: var(--gold); text-decoration: underline;">Voltar para o Login</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
