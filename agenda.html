<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Confira a agenda de shows da dupla sertaneja Cadu & Fellipe." />
  <title>Agenda — Cadu & Fellipe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="img/logo preta.png" />

  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="agenda.css" />
</head>

<body>

  <img src="img/cadu e fellipe.png" alt="" class="bg-image" aria-hidden="true" />
  <div class="page-overlay" aria-hidden="true"></div>

  <!-- ======= HEADER ======= -->
  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="logo-link" href="index.html" aria-label="Cadu & Fellipe — Início">
        <img src="img/logo.png" alt="Cadu & Fellipe" class="logo" />
      </a>

      <button class="hamburger" aria-label="Abrir menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" aria-label="Menu principal">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="agenda.html" class="ativo">Agenda</a></li>
          <li><a href="pacotes.html">Pacotes</a></li>
          <li><a href="fotos.html">Fotos</a></li>
          <li><a href="opinioes.html">Opiniões</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- ======= CONTEÚDO ======= -->
  <main class="agenda-container" id="main-content">
    <h1 class="section-title">Agenda</h1>
    <hr class="section-line" />

    <!-- Filtros -->
    <div class="agenda-filtros" role="group" aria-label="Filtrar shows">
      <button class="filtro-btn ativo" data-filtro="todos">Todos</button>
      <button class="filtro-btn" data-filtro="semana">Esta Semana</button>
      <button class="filtro-btn" data-filtro="mes">Este Mês</button>
    </div>

    <!-- Estado: carregando -->
    <div class="agenda-loading" id="agenda-loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Carregando shows…</p>
    </div>

    <!-- Estado: sem shows -->
    <p class="agenda-empty hidden" id="agenda-empty">
      Nenhum show agendado no momento. Fique ligado!
    </p>

    <!-- Lista de eventos -->
    <ul class="agenda-list hidden" id="agenda-list" aria-label="Lista de shows">
    </ul>
  </main>

  <!-- ======= RODAPÉ ======= -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-content">
      <p>© 2026 Cadu & Fellipe • Todos os direitos reservados</p>
      <a href="admin.html" class="footer-lock-link" aria-label="Acesso Administrativo" title="Painel Administrativo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </a>
    </div>
  </footer>

  <!-- SCROLL TO TOP -->
  <a href="#" class="scroll-to-top" aria-label="Voltar ao topo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </a>

  <!-- REDES SOCIAIS -->
  <div class="social-follow" aria-label="Redes sociais">
    <span class="follow-label">Siga-nos:</span>
    <a href="https://www.instagram.com/caduefellipe" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <img src="img/instagramColorido.png" class="follow-icon" alt="Instagram" />
    </a>
    <a href="https://wa.me/5519996265757" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
      <img src="img/zapColorido.png" class="follow-icon" alt="WhatsApp" />
    </a>
  </div>

  <script src="nav.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="agenda.js"></script>
</body>
</html>
